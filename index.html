<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monster Puppet Theater</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="marquee">
    <p class="marquee__eyebrow">— One Night Only —</p>
    <h1 class="marquee__title">Monster Puppet Theater</h1>
    <p class="marquee__sub">Jack-o'-Lantern Synth : Monster Puppet Session</p>
  </header>

  <main class="theater">
    <!-- Framed stage -->
    <section class="proscenium" id="proscenium" data-state="closed" aria-label="Puppet theater stage">
      <div class="frame-corner frame-corner--tl"></div>
      <div class="frame-corner frame-corner--tr"></div>
      <div class="frame-corner frame-corner--bl"></div>
      <div class="frame-corner frame-corner--br"></div>

      <div class="stage" id="stage">
        <div class="backdrop"></div>
        <div class="spotlight"></div>
        <div class="puppets" id="puppets"></div>
        <div class="floor"></div>

        <div class="curtain curtain--left"></div>
        <div class="curtain curtain--right"></div>
        <div class="curtain-hint" id="curtainHint">The show will begin shortly</div>
      </div>

      <div class="valance" aria-hidden="true">
        <div class="valance__tassel valance__tassel--l"></div>
        <div class="valance__tassel valance__tassel--r"></div>
      </div>

      <div class="footlights" id="footlights" aria-hidden="true"></div>
    </section>

    <!-- Play / Stop -->
    <div class="controls">
      <button class="btn btn--play" id="playBtn" type="button">Play <span>Curtain Up</span></button>
      <button class="btn btn--stop" id="stopBtn" type="button" disabled>Stop <span>Curtain Call</span></button>
    </div>

    <!-- Program: generated band name, song title, and the two souvenirs -->
    <section class="playbill" aria-label="Tonight's program">
      <p class="playbill__eyebrow">Now Performing</p>
      <h2 class="playbill__band" id="bandName"></h2>
      <p class="playbill__tagline" id="bandTagline"></p>
      <p class="playbill__song" id="songTitle"></p>
      <p class="playbill__genre" id="songGenre"></p>
      <div class="playbill__actions">
        <button class="btn btn--small" id="posterBtn" type="button">Save Poster (PNG)</button>
        <button class="btn btn--small" id="wavBtn" type="button">Export Loop (WAV)</button>
      </div>
      <p class="playbill__status" id="exportStatus" role="status" aria-live="polite"></p>
    </section>

    <!-- Puppet selection + 3-slot UI -->
    <section class="workbench" aria-label="Puppet editor">
      <nav class="tabs" id="puppetTabs" role="tablist" aria-label="Select puppet"></nav>
      <div class="panel" id="slotPanel"></div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
